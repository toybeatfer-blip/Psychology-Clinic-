services:
  # 1. Backend Web Service API
  - type: web
    name: psychoclinic-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: psychoclinic-db
          property: connectionString

  # 2. Frontend Static Site
  - type: static
    name: psychoclinic-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: psychoclinic-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: psychoclinic-db
    plan: free
    databaseName: psychoclinic
    user: postgres
