services:
  # 1. PsychoCare Monolith Web Service (Full-Stack: API + Frontend + Cloud Sync)
  - type: web
    name: psychoclinic-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: psychoclinic-db
          property: connectionString

databases:
  # 2. PostgreSQL Central Database
  - name: psychoclinic-db
    plan: free
    databaseName: psychoclinic
    user: postgres
