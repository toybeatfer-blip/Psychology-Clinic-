<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:brain-circuit.svg?color=%230d9488" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsychoCare - Gestión de Consultorio Psicológico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Reglas estrictas anti-caché para navegadores móviles y de escritorio -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        var APP_BUILD = "v2026.09.07.1";
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          var lastBuild = localStorage.getItem('__app_build_version__');
          if (lastBuild !== APP_BUILD) {
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
              }).catch(function() {});
            }
            try {
              var toRemove = [];
              for (var j = 0; j < localStorage.length; j++) {
                var k = localStorage.key(j);
                if (k && (k.startsWith('__temp_') || k.startsWith('vite_') || k.indexOf('stale_') !== -1)) {
                  toRemove.push(k);
                }
              }
              toRemove.forEach(function(k) { localStorage.removeItem(k); });
            } catch (e) {}
            localStorage.setItem('__app_build_version__', APP_BUILD);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
